services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promptpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptpilot_change_me}
      POSTGRES_DB: promptpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptpilot -d promptpilot"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://promptpilot:${POSTGRES_PASSWORD:-promptpilot_change_me}@db:5432/promptpilot?schema=public
      MODEL_API_URL: ${MODEL_API_URL:-https://api.siliconflow.cn/v1}
      MODEL_NAME: ${MODEL_NAME:-deepseek-ai/DeepSeek-V3}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MAX_INPUT_LENGTH: ${MAX_INPUT_LENGTH:-4000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
